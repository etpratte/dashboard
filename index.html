<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1b2430;--mute:#66727f;--line:#d9dfe5;--acc:#2563eb;--accsoft:#dbe6fb;--warn:#b4432f;
--serif:'Newsreader',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--panel:#1a212a;--ink:#e6ebf0;--mute:#8d9aa8;--line:#2b3541;--acc:#7aa9ff;--accsoft:#1e2b47;--warn:#e58a76}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 22px var(--serif)}
.ring.sm{width:44px;height:44px}.ring.sm b{font:700 12px var(--sans)}
.hd h1{font:700 34px/1.1 var(--serif);margin:0}
.hd p{margin:4px 0 0;color:var(--mute)}
.sync{margin-left:auto;text-align:right;color:var(--mute);font-size:13px}
.btn{background:var(--acc);color:var(--bg);border-radius:8px;padding:7px 14px;font-weight:500}
.ghost{color:var(--mute);padding:4px 8px;border-radius:6px}.ghost:hover{background:var(--accsoft);color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px}
@media (max-width:760px){main{grid-template-columns:1fr}}
h2{font:700 20px var(--serif);margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
section+section{margin-top:28px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dow{color:var(--mute);font-size:12px;padding:4px 0}
.day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day:hover{background:var(--accsoft)}
.day.out{color:var(--mute);opacity:.5}
.day.today{box-shadow:inset 0 0 0 1.5px var(--acc)}
.day.sel{background:var(--acc);color:var(--bg)}
.dots{display:flex;gap:3px;height:5px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.day.sel .dots i{background:var(--bg)}.dots i.t{background:var(--warn)}.day.sel .dots i.t{background:var(--bg)}
.dayview{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.dayview h3{margin:0 0 6px;font-size:15px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{color:var(--mute);text-decoration:line-through}
.time{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);flex:none;display:grid;place-items:center}
.done .chk{background:var(--acc);border-color:var(--acc)}
.done .chk::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.x{color:var(--mute);opacity:.6;padding:2px 6px}.x:hover{opacity:1;color:var(--warn)}
.due{font-size:12px;color:var(--mute)}.due.late{color:var(--warn)}
form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input[type=text],input[type=date],input[type=time]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=date],input[type=time]{flex:none}
.empty{color:var(--mute);padding:8px 0}
.list{margin-top:14px}
.list-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.list-h h3{margin:0;flex:1;font:700 17px var(--serif)}
.tag{font-size:12px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.gate{max-width:420px;margin:12vh auto;text-align:center}
.gate h1{font:700 34px var(--serif)}
.tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:999px;color:var(--mute);font-weight:500;white-space:nowrap}
.tab.on{background:var(--acc);color:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.panel+.panel,.panel+details{margin-top:16px}.cards .panel+.panel{margin-top:0}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:4px 10px;color:var(--mute)}.seg .on{background:var(--acc);color:var(--bg)}
.day{aspect-ratio:auto;min-height:64px;justify-content:flex-start;padding:4px 2px;gap:2px}
.chips{display:block;width:100%}
.chip{display:block;font-size:10px;line-height:1.3;padding:1px 3px;margin-top:1px;border-radius:4px;background:var(--accsoft);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal}
.chip.once{background:var(--acc);color:var(--bg)}.chip.bday{background:#d9a441;color:#2a1c00}
.day.sel .chip{background:var(--bg);color:var(--ink)}
.more{font-size:10px;font-style:normal;opacity:.7}
@media(max-width:600px){.chips{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}.chip{width:6px;height:6px;padding:0;border-radius:50%;font-size:0}}
.wkday{padding:8px 0;border-top:1px solid var(--line)}.wkday h4{margin:0 0 2px;font-size:14px}.wkday.today h4{color:var(--acc)}
.ev.once .time{color:var(--acc)}
textarea{width:100%;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);resize:vertical;margin-top:10px}
.errs{color:var(--warn);font-size:13px;margin-top:6px}
details.add{margin-top:8px}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary.btn{display:inline-block}
input[type=number],.sm{flex:none;width:76px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.dchk{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;width:100%}.dchk label{display:flex;align-items:center;gap:3px}
.done-box summary{font-weight:500}
.strip{display:flex;gap:6px}.hhead{display:flex;justify-content:flex-end;gap:6px;padding-right:36px;color:var(--mute);font-size:12px}.hhead span{width:22px;text-align:center}
.chk.on{background:var(--acc);border-color:var(--acc)}
.chk.on::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.hring{display:flex;align-items:center;gap:12px}.foot{margin-top:24px;text-align:center}
.tgw{overflow-x:auto}.tg.wide{min-width:600px}
.tgr{display:grid;grid-template-columns:48px repeat(var(--n),minmax(0,1fr))}
.tgd{padding:6px 2px;text-align:center;font-weight:500;border-radius:6px}.tgd.today{color:var(--acc)}.tgd:hover{background:var(--accsoft)}
.tgl{font-size:11px;color:var(--mute);padding:4px 4px 0 0}
.tgr.ad{border-bottom:1px solid var(--line);margin-bottom:4px;min-height:24px}
.tgc{padding:2px;border-left:1px solid var(--line)}
.tgut{position:relative}.tgut span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--mute)}.tgut span:first-child{transform:none}
.tcol{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 44px}
.blk{position:absolute;overflow:hidden;box-sizing:border-box;padding:2px 4px;font-size:11px;line-height:1.25;border-radius:6px;border:1px solid var(--bg)}
.blk b{font-weight:600}.blk.once{background:var(--acc);color:var(--bg)}.blk.rec{background:var(--accsoft);color:var(--ink);border-left:3px solid var(--acc)}
@media(max-width:600px){.tgc .chip{width:auto;height:auto;font-size:10px;padding:1px 3px;border-radius:4px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============ SETUP: paste your Google OAuth Client ID here ============ */
const CLIENT_ID = '751050802849-tfq9adfabsv9atanq4bco2naqj6na1pa.apps.googleusercontent.com';
/* ======================================================================= */

const FILE = 'dashboard.json', SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const $app = document.getElementById('app');
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayStr = () => ymd(new Date());
const now = () => Date.now();

let state = {};
let view = {tab: localStorage.getItem('dash-tab') || 'home', mode: 'month', cur: new Date()};
let token = null, exp = 0, tc = null, fileId = null, status = 'offline', signedIn = false;
const known = () => !!localStorage.getItem('dash-in');
let saveTimer = null, busy = false;

function load() { try { return JSON.parse(localStorage.getItem('dash-cache')); } catch (e) { return null; } }
function cache() { try { localStorage.setItem('dash-cache', JSON.stringify(state)); } catch (e) {} }
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2600); }

/* ---------- merge: union by id, newest edit (u) wins; deletions are tombstones ---------- */
function mergeArr(a = [], b = [], nested) {
  const m = new Map();
  [...a, ...b].forEach(x => { const o = m.get(x.id); if (!o) m.set(x.id, x); else { const w = (x.u || 0) >= (o.u || 0) ? x : o; m.set(x.id, w); } });
  if (nested) m.forEach((v, k) => { const o1 = a.find(z => z.id === k), o2 = b.find(z => z.id === k); v.items = mergeArr(o1 && o1.items, o2 && o2.items); });
  return [...m.values()];
}
const merge = (a, b) => { a = norm({...a}); b = norm({...b}); const sched = {}; LISTS.forEach(k => { sched[k] = pick(a.sched[k], b.sched[k]); }); return norm({...b, ...a, sched}); };

/* ---------- Google auth + Drive ---------- */
function initAuth() {
  if (!window.google || !google.accounts) return setTimeout(initAuth, 200);
  tc = google.accounts.oauth2.initTokenClient({client_id: CLIENT_ID, scope: SCOPE, callback: () => {}});
  try { const k = JSON.parse(localStorage.getItem('dash-tok')); if (k && k.exp > now()) { token = k.t; exp = k.exp; signedIn = true; pull(true); startPolling(); return; } } catch (e) {}
  render();
}
function getToken(prompt) {
  return new Promise((res, rej) => {
    tc.callback = r => { if (r.error) return rej(r); token = r.access_token; exp = now() + (r.expires_in - 60) * 1000; try { localStorage.setItem('dash-tok', JSON.stringify({t: token, exp})); } catch (e) {} res(token); };
    tc.error_callback = e => rej(e);
    tc.requestAccessToken({prompt});
  });
}
async function api(url, opts = {}, retry = true) {
  if (!token || now() > exp) { token = null; signedIn = false; status = 'offline'; render(); throw new Error('expired'); }
  const r = await fetch(url, {...opts, headers: {...(opts.headers || {}), Authorization: 'Bearer ' + token}});
  if (r.status === 401 && retry) { token = null; return api(url, opts, false); }
  if (!r.ok) throw new Error('Drive ' + r.status);
  return r;
}
async function connect(prompt) {
  try {
    await getToken(prompt);
    localStorage.setItem('dash-in', '1'); signedIn = true;
    await pull(true);
    startPolling();
  } catch (e) { status = 'offline'; signedIn = false; render(); toast('Sign-in did not finish. Tap Sign in to try again.'); }
}
async function findFile() {
  const q = encodeURIComponent("name='" + FILE + "'");
  const r = await (await api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q=' + q)).json();
  return r.files[0] ? r.files[0].id : null;
}
async function readRemote() {
  if (!fileId) fileId = await findFile();
  if (!fileId) return null;
  return (await api('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media')).json();
}
async function writeRemote(data) {
  const body = JSON.stringify(data);
  if (fileId) { await api('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body}); return; }
  const b = 'dashb' + uid(), meta = JSON.stringify({name: FILE, parents: ['appDataFolder']});
  const mp = '--' + b + '\r\nContent-Type: application/json\r\n\r\n' + meta + '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + b + '--';
  const r = await (await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {method: 'POST', headers: {'Content-Type': 'multipart/related; boundary=' + b}, body: mp})).json();
  fileId = r.id;
}
async function pull(first) {
  if (busy) return; busy = true; status = 'syncing'; render();
  try {
    const remote = await readRemote();
    if (remote) { const before = JSON.stringify(state); state = merge(state, remote); if (first || JSON.stringify(state) !== before) { cache(); } }
    if (!remote || JSON.stringify(state) !== JSON.stringify(remote)) await writeRemote(state);
    status = 'synced'; render();
  } catch (e) { status = signedIn ? 'error' : 'offline'; render(); }
  busy = false;
}
function startPolling() {
  if (startPolling.on) return; startPolling.on = true;
  setInterval(() => { if (!document.hidden && signedIn && !saveTimer) pull(); }, 25000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && signedIn && !saveTimer) pull(); });
}
function changed(quiet) {
  cache(); if (!quiet) render(true);
  if (!signedIn) return;
  status = 'saving'; clearTimeout(saveTimer);
  const sy = document.getElementById('sync'); if (sy) sy.textContent = statusText();
  saveTimer = setTimeout(async () => { saveTimer = null; busy = false; await pull(); }, 700);
}

/* ---------- data helpers ---------- */
const live = a => a.filter(x => !x.del);
const pad = n => String(n).padStart(2, '0');
const cap = s => s[0].toUpperCase() + s.slice(1);
const MON = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'], DAYN = ['sun','mon','tue','wed','thu','fri','sat'];
const fmtD = (d, y) => d.toLocaleDateString(undefined, y ? {month: 'short', day: 'numeric', year: 'numeric'} : {month: 'short', day: 'numeric'});
const fmtL = d => d.toLocaleDateString(undefined, {weekday: 'long', month: 'short', day: 'numeric'});
const fts = ts => { const d = new Date(ts); return fmtD(d, d.getFullYear() !== new Date().getFullYear()); };
const ft = n => { const h = Math.floor(n / 60), m = n % 60; return ((h + 11) % 12 + 1) + (m ? ':' + pad(m) : '') + (h < 12 ? 'am' : 'pm'); };
const LISTS = ['once', 'rec', 'bday', 'todo', 'habit'];
const lineD = ts => { const d = new Date(ts); return cap(MON[d.getMonth()]) + ' ' + d.getDate() + ' ' + d.getFullYear(); };
function norm(s) {
  s.sched = s.sched || {};
  LISTS.forEach(k => { s.sched[k] = s.sched[k] || {t: '', u: 0}; });
  if (s.tasks) {
    if (!s.sched.todo.t) s.sched.todo = {t: s.tasks.filter(t => !t.del).sort((a, b) => (a.c || a.u || 0) - (b.c || b.u || 0)).map(t => { const c = t.c || t.u, k = t.k != null ? t.k : (t.done ? t.u : 0); return (k ? '### ' : '') + (c ? lineD(c) + ' ' : '') + (k ? '> ' + lineD(k) + ' ' : '') + t.t; }).join('\n'), u: 1};
    delete s.tasks;
  }
  if (s.habits) {
    if (!s.sched.habit.t) s.sched.habit = {t: s.habits.filter(h => !h.del).map(h => h.name + ' | ' + Object.keys(h.days || {}).sort().join(', ')).join('\n'), u: 1};
    delete s.habits;
  }
  return s;
}
const pick = (x, y) => ((x && x.u) || 0) >= ((y && y.u) || 0) ? x : y;
const ring = (pct, size, sw) => {
  const r = (size - sw) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--acc)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"/></svg>`;
};

/* ---------- schedule parsing: the text lists are the only source of events ---------- */
const T = '(\\d{1,2}:\\d{2}\\s*(?:[ap]m)?|\\d{1,2}\\s*[ap]m)';
function tm(s) { const m = /^(\d{1,2})(?::(\d{2}))?\s*([ap]m)?$/i.exec(s.trim()); if (!m) return null; let h = +m[1], n = +(m[2] || 0); const p = (m[3] || '').toLowerCase(); if (p === 'pm' && h < 12) h += 12; if (p === 'am' && h === 12) h = 0; return h > 23 || n > 59 ? null : h * 60 + n; }
function trange(r) {
  const m = new RegExp('^' + T + '(?:\\s*[-\u2013]\\s*' + T + ')?(?:\\s+|$)', 'i').exec(r);
  if (!m) return {s: null, e: null, rest: r};
  const s = tm(m[1]), e = m[2] ? tm(m[2]) : null;
  return s == null || (m[2] && e == null) ? null : {s, e, rest: r.slice(m[0].length)};
}
const dateOk = (y, mo, d) => { const x = new Date(y, mo, d); return x.getMonth() === mo && x.getDate() === d; };
function pOnce(l) {
  const m = /^([a-z]{3})[a-z]*\.?\s+(\d{1,2})(?:\s+(\d{4}))?(?:\s+|$)(.*)$/i.exec(l); if (!m) return null;
  const mo = MON.indexOf(m[1].toLowerCase()), y = m[3] ? +m[3] : new Date().getFullYear(), d = +m[2];
  if (mo < 0 || !dateOk(y, mo, d)) return null;
  const r = trange(m[4]); if (!r || !r.rest.trim()) return null;
  return {y, m: mo, d, s: r.s, e: r.e, t: r.rest.trim()};
}
const DR = /^(daily|weekdays|weekends|mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\b[\s,/&]*/i;
function pRec(l) {
  let r = l, days = new Set(), mm, n = 0;
  while ((mm = DR.exec(r))) {
    const w = mm[1].toLowerCase();
    if (w === 'daily') [0,1,2,3,4,5,6].forEach(i => days.add(i)); else if (w === 'weekdays') [1,2,3,4,5].forEach(i => days.add(i)); else if (w === 'weekends') { days.add(0); days.add(6); } else days.add(DAYN.indexOf(w.slice(0, 3)));
    r = r.slice(mm[0].length); n++;
  }
  if (!n) return null;
  const t = trange(r); if (!t || !t.rest.trim()) return null;
  return {days, s: t.s, e: t.e, t: t.rest.trim()};
}
function pBday(l) {
  const m = /^([a-z]{3})[a-z]*\.?\s+(\d{1,2})(?:\s+(\d{4}))?\s+(.+)$/i.exec(l); if (!m) return null;
  const mo = MON.indexOf(m[1].toLowerCase()), d = +m[2]; if (mo < 0 || !dateOk(2024, mo, d)) return null;
  return {m: mo, d, y: m[3] ? +m[3] : 0, t: m[4].trim()};
}
const DT = /^([a-z]{3})[a-z]*\.?\s+(\d{1,2})\s+(\d{4})(?:\s+|$)/i;
function pDate(r) { const m = DT.exec(r); if (!m) return null; const mo = MON.indexOf(m[1].toLowerCase()), y = +m[3], d = +m[2]; return mo < 0 || !dateOk(y, mo, d) ? null : {ts: new Date(y, mo, d).getTime(), n: m[0].length}; }
function pTodo(l) {
  let r = l, k = false, c = null, kd = null, m;
  if (r.startsWith('###')) { k = true; r = r.slice(3).trim(); }
  if ((m = pDate(r))) { c = m.ts; r = r.slice(m.n); }
  if ((m = /^>\s*/.exec(r))) { r = r.slice(m[0].length); if ((m = pDate(r))) { kd = m.ts; r = r.slice(m.n); } }
  r = r.trim(); return r ? {k, c, kd, t: r} : null;
}
function pHabit(l) {
  const i = l.lastIndexOf('|'), name = (i < 0 ? l : l.slice(0, i)).trim(), days = {};
  if (i >= 0) l.slice(i + 1).split(/[\s,]+/).forEach(x => { if (/^\d{4}-\d{2}-\d{2}$/.test(x)) days[x] = 1; });
  return name ? {name, days} : null;
}
let memo = {k: '', v: null};
function getSched() {
  const s = state.sched, k = LISTS.map(x => s[x].t).join('\u0001'); if (memo.k === k) return memo.v;
  const out = {errs: {}}, fns = {once: pOnce, rec: pRec, bday: pBday, todo: pTodo, habit: pHabit};
  for (const key of LISTS) {
    out[key] = []; out.errs[key] = [];
    s[key].t.split('\n').forEach((raw, i) => {
      const l = raw.trim(); if (!l || (l[0] === '#' && key !== 'todo')) return;
      const r = fns[key](l); if (r) { r.i = i; out[key].push(r); } else out.errs[key].push([i + 1, l]);
    });
  }
  memo = {k, v: out}; return out;
}
function eventsOn(d) {
  const S = getSched(), y = d.getFullYear(), mo = d.getMonth(), da = d.getDate(), w = d.getDay(), out = [];
  S.once.forEach(o => { if (o.y === y && o.m === mo && o.d === da) out.push({...o, k: 'once'}); });
  S.rec.forEach(o => { if (o.days.has(w)) out.push({...o, k: 'rec'}); });
  S.bday.forEach(o => { if (o.m === mo && o.d === da) out.push({s: null, e: null, t: '\uD83C\uDF82 ' + o.t + (o.y ? ' (' + (y - o.y) + ')' : ''), k: 'bday'}); });
  return out.sort((a, b) => (a.s == null ? -1 : a.s) - (b.s == null ? -1 : b.s));
}
const agenda = d => { const ev = eventsOn(d); return ev.length ? ev.map(e => `<div class="row ev ${e.k}"><span class="time">${e.s == null ? 'all day' : ft(e.s) + (e.e != null ? '\u2013' + ft(e.e) : '')}</span><span class="t">${esc(e.t)}</span></div>`).join('') : '<div class="empty">Nothing scheduled.</div>'; };

/* ---------- habits ---------- */
const hToday = () => { const t = todayStr(), h = getSched().habit; return {tot: h.length, done: h.filter(x => x.days[t]).length}; };
function streak(h) { const d = new Date(); let n = 0; if (!h.days[ymd(d)]) d.setDate(d.getDate() - 1); while (h.days[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }

/* ---------- render ---------- */
const TABS = [['home', 'Dashboard'], ['sched', 'Schedule'], ['todo', 'To-do'], ['habit', 'Habits']];
const statusText = () => ({synced: 'Synced', syncing: 'Syncing\u2026', saving: 'Saving\u2026', error: 'Sync failed, will retry', offline: 'Not synced'}[status]);
function render(force) {
  if (!signedIn && !known()) {
    $app.innerHTML = `<div class="gate"><h1>My dashboard</h1><p class="empty">Sign in with Google to load your data from your own Drive. Nothing is stored anywhere else.</p><button class="btn" data-a="signin">Sign in with Google</button></div>`;
    return;
  }
  if (!force && $app.querySelector('input:focus,textarea:focus')) { const s = document.getElementById('sync'); if (s) s.textContent = statusText(); return; }
  const d = new Date();
  $app.innerHTML = `<header><div class="hd"><h1>${d.toLocaleDateString(undefined, {weekday: 'long'})}</h1><p>${d.toLocaleDateString(undefined, {month: 'long', day: 'numeric'})}</p></div>
  <div class="sync"><span id="sync">${statusText()}</span> ${signedIn ? '' : '<button class="btn" data-a="signin">Sign in to sync</button>'}</div></header>
  <nav class="tabs">${TABS.map(([k, n]) => `<button class="tab${view.tab === k ? ' on' : ''}" data-a="tab" data-v="${k}">${n}</button>`).join('')}</nav>
  ${({home: homeP, sched: schedP, todo: todoP, habit: habitP})[view.tab]()}
  <div class="foot"><button class="ghost" data-a="backup">Download backup</button></div>`;
  if (view.rf) { const el = $app.querySelector(`[name="${view.rf}"]`); view.rf = null; if (el) el.focus(); }
}

function homeP() {
  const t = new Date(), S = getSched(), open = S.todo.filter(x => !x.k), hd = hToday(), up = [];
  for (let i = 1; i <= 7; i++) { const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i); eventsOn(d).filter(e => e.k !== 'rec').forEach(e => up.push([d, e])); }
  return `<div class="cards">
  <div class="panel"><h2>Today</h2>${agenda(t)}</div>
  <div class="panel"><h2>To-do <span class="tag">${open.length} open</span></h2>${open.slice(0, 6).map(x => `<div class="row"><span class="t">${esc(x.t)}</span></div>`).join('') || '<div class="empty">All clear.</div>'}${open.length > 6 ? `<div class="tag">+${open.length - 6} more</div>` : ''}</div>
  <div class="panel"><h2>Habits</h2><div class="hring"><div class="ring">${ring(hd.tot ? hd.done / hd.tot : 0, 96, 9)}<b>${hd.tot ? hd.done + '/' + hd.tot : '\u2013'}</b></div><span class="tag">done today</span></div></div>
  <div class="panel"><h2>Coming up</h2>${up.slice(0, 8).map(([d, e]) => `<div class="row"><span class="time">${fmtD(d)}</span><span class="t">${esc(e.t)}</span></div>`).join('') || '<div class="empty">Nothing in the next 7 days.</div>'}</div></div>
  <p class="tag">Placeholder summary. Tell me what you want here.</p>`;
}

const PX = 44;
function lanes(list) {
  const out = []; let grp = [], gend = -1;
  const flush = () => { const ends = []; grp.forEach(e => { let l = ends.findIndex(x => x <= e.s); if (l < 0) { l = ends.length; ends.push(0); } ends[l] = e.en; e.lane = l; }); grp.forEach(e => { e.n = ends.length; }); out.push(...grp); grp = []; };
  list.forEach(e => { if (grp.length && e.s >= gend) { flush(); gend = -1; } grp.push(e); gend = Math.max(gend, e.en); });
  flush(); return out;
}
function gridHtml(days) {
  const evs = days.map(eventsOn), td = todayStr(); let lo = 7, hi = 20;
  const en = e => e.e != null ? (e.e > e.s ? e.e : 1440) : e.s + 30;
  evs.forEach(a => a.forEach(e => { if (e.s != null) { lo = Math.min(lo, Math.floor(e.s / 60)); hi = Math.max(hi, Math.min(24, Math.ceil(en(e) / 60))); } }));
  const H = (hi - lo) * PX;
  const head = days.map(d => `<button class="tgd${ymd(d) === td ? ' today' : ''}" data-a="goday" data-v="${ymd(d)}">${d.toLocaleDateString(undefined, {weekday: 'short'})} ${d.getDate()}</button>`).join('');
  const ad = evs.map(a => `<div class="tgc">${a.filter(e => e.s == null).map(e => `<i class="chip ${e.k}">${esc(e.t)}</i>`).join('')}</div>`).join('');
  const cols = evs.map(a => `<div class="tcol" style="height:${H}px">${lanes(a.filter(e => e.s != null).map(e => ({...e, en: en(e)}))).map(e => { const tr = ft(e.s) + (e.e != null ? '\u2013' + ft(e.e) : ''); return `<div class="blk ${e.k}" style="top:${(e.s - lo * 60) / 60 * PX}px;height:${Math.max(18, (e.en - e.s) / 60 * PX - 2)}px;left:${e.lane / e.n * 100}%;width:${100 / e.n}%" title="${esc(tr + ' ' + e.t)}"><b>${tr}</b> ${esc(e.t)}</div>`; }).join('')}</div>`).join('');
  const hrs = [...Array(hi - lo)].map((_, i) => `<span style="top:${i * PX}px">${ft((lo + i) * 60)}</span>`).join('');
  return `<div class="tgw"><div class="tg${days.length > 1 ? ' wide' : ''}" style="--n:${days.length}"><div class="tgr"><div></div>${head}</div><div class="tgr ad"><div class="tgl">all day</div>${ad}</div><div class="tgr"><div class="tgut" style="height:${H}px">${hrs}</div>${cols}</div></div></div>`;
}

function calHtml() {
  const c = view.cur, m = view.mode, t = todayStr(); let title, body;
  if (m === 'month') {
    const y = c.getFullYear(), mo = c.getMonth(), st = new Date(y, mo, 1 - new Date(y, mo, 1).getDay());
    title = c.toLocaleDateString(undefined, {month: 'long', year: 'numeric'});
    let cells = ['S','M','T','W','T','F','S'].map(x => `<div class="dow">${x}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = new Date(st.getFullYear(), st.getMonth(), st.getDate() + i), s = ymd(d), ev = eventsOn(d);
      cells += `<button class="day${d.getMonth() !== mo ? ' out' : ''}${s === t ? ' today' : ''}${s === ymd(c) ? ' sel' : ''}" data-a="pick" data-v="${s}"><span>${d.getDate()}</span><span class="chips">${ev.slice(0, 2).map(e => `<i class="chip ${e.k}">${esc(e.t)}</i>`).join('')}${ev.length > 2 ? `<i class="more">+${ev.length - 2}</i>` : ''}</span></button>`;
    }
    body = `<div class="grid">${cells}</div><div class="dayview"><h3>${fmtL(c)}</h3>${agenda(c)}</div>`;
  } else if (m === 'week') {
    const s = new Date(c.getFullYear(), c.getMonth(), c.getDate() - c.getDay()), e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6);
    title = fmtD(s) + ' \u2013 ' + fmtD(e);
    body = gridHtml([...Array(7)].map((_, i) => new Date(s.getFullYear(), s.getMonth(), s.getDate() + i)));
  } else { title = fmtL(c); body = gridHtml([c]); }
  return `<div class="tb"><h2 style="margin:0;flex:1">${title}</h2><span class="seg">${['month', 'week', 'day'].map(x => `<button class="${m === x ? 'on' : ''}" data-a="mode" data-v="${x}">${cap(x)}</button>`).join('')}</span><span><button class="ghost" data-a="nav" data-v="-1" aria-label="Previous">\u2039</button><button class="ghost" data-a="today">Today</button><button class="ghost" data-a="nav" data-v="1" aria-label="Next">\u203A</button></span></div>${body}`;
}
const errHtml = k => getSched().errs[k].map(([n, l]) => `<div>Line ${n} can't be read: ${esc(l)}</div>`).join('');
function editor(k, title, hint, form) {
  const txt = state.sched[k].t;
  return `<section class="panel"><h2>${title}</h2><p class="tag">${hint} Delete a line to remove the event.</p>${form ? `<details class="add"><summary class="btn">+ Add</summary>${form}</details>` : ''}<textarea data-k="${k}" rows="${Math.max(4, txt.split('\n').length + 1)}" spellcheck="false" aria-label="${title}">${esc(txt)}</textarea><div class="errs" id="err-${k}">${errHtml(k)}</div></section>`;
}
const when = `<label class="tag">Start <input type="time" name="s"></label><label class="tag">End <input type="time" name="e"></label>`;
function schedP() {
  const md = `<input type="text" class="sm" name="mo" placeholder="Mar" maxlength="3" autocapitalize="off" required><input type="number" name="da" min="1" max="31" placeholder="Day" required>`;
  const rec = `<form data-f="rec"><div class="dchk">${[1,2,3,4,5,6,0].map(i => `<label><input type="checkbox" name="d" value="${i}">${cap(DAYN[i])}</label>`).join('')}</div>${when}<input type="text" name="t" placeholder="Description" required><button class="btn">Add</button></form>`;
  return `<div class="panel" id="calwrap">${calHtml()}</div>
  ${editor('once', 'One-time events', 'Format: Mar 5 2026 14:00-15:30 Description. Year and times are optional; no time means all day.', `<form data-f="once">${md}${when}<input type="text" name="t" placeholder="Description" required><button class="btn">Add</button></form>`)}
  ${editor('rec', 'Recurring events', 'Format: Mon,Wed,Fri 9:00-10:00 Description. Also daily, weekdays, weekends.', rec)}
  ${editor('bday', 'Birthdays', 'Format: Mar 5 1990 Name. The year is optional and shows an age.', `<form data-f="bday">${md}<input type="number" name="yr" min="1900" max="2100" placeholder="Year"><input type="text" name="t" placeholder="Name" required><button class="btn">Add</button></form>`)}`;
}

const addLine = (k, line) => { const cur = state.sched[k].t; state.sched[k] = {t: (cur && !/\n$/.test(cur) ? cur + '\n' : cur) + line, u: now()}; };
const lineOp = (k, i, fn) => { const ls = state.sched[k].t.split('\n'), r = fn(ls[i]); if (r == null) ls.splice(i, 1); else ls[i] = r; state.sched[k] = {t: ls.join('\n'), u: now()}; };
const trow = x => `<div class="row${x.k ? ' done' : ''}"><button class="chk" data-a="tog" data-v="${x.i}" aria-label="${x.k ? 'Uncheck' : 'Check'}"></button><span class="t">${esc(x.t)}</span><span class="due">${x.c ? 'Added ' + fts(x.c) : ''}${x.kd ? ' \u00B7 Checked ' + fts(x.kd) : ''}</span><button class="x" data-a="deltask" data-v="${x.i}" aria-label="Delete">\u2715</button></div>`;
function todoVis() {
  const all = getSched().todo, open = all.filter(x => !x.k), done = all.filter(x => x.k);
  return `<div class="panel"><h2>To-do</h2>${open.map(trow).join('') || '<div class="empty">Nothing to do.</div>'}<form data-f="task"><input type="text" name="task" placeholder="Add a task" required><button class="btn">Add</button></form></div>
  <details class="panel done-box"${view.dopen ? ' open' : ''}><summary>Checked off (${done.length})</summary>${done.map(trow).join('') || '<div class="empty">Nothing checked yet.</div>'}</details>`;
}
const todoP = () => `<div id="vis">${todoVis()}</div>${editor('todo', 'To-do list', 'One task per line: Oct 14 2026 Buy milk. A line starting with ### is checked off: ### Oct 14 2026 > Oct 15 2026 Buy milk.', '')}`;
function habitVis() {
  const h = getSched().habit, days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return d; });
  return `<div class="panel"><h2>Habits</h2>${h.length ? `<div class="hhead">${days.map(d => `<span>${d.toLocaleDateString(undefined, {weekday: 'narrow'})}</span>`).join('')}</div>` : ''}${h.map(x => `<div class="row"><span class="t">${esc(x.name)} <span class="tag">\uD83D\uDD25${streak(x)}</span></span><span class="strip">${days.map(d => { const s = ymd(d); return `<button class="chk${x.days[s] ? ' on' : ''}" data-a="hab" data-v="${x.i}" data-d="${s}" aria-label="${s}"></button>`; }).join('')}</span><button class="x" data-a="delhab" data-v="${x.i}" aria-label="Delete">\u2715</button></div>`).join('') || '<div class="empty">No habits yet.</div>'}
  <form data-f="habit"><input type="text" name="habit" placeholder="New habit" required><button class="btn">Add</button></form><p class="tag">Placeholder tracker. Tell me what you want here.</p></div>`;
}
const habitP = () => `<div id="vis">${habitVis()}</div>${editor('habit', 'Habit list', 'One habit per line with the days you did it: Meditate | 2026-10-12, 2026-10-13.', '')}`;

/* ---------- events ---------- */
const reCal = () => { const w = document.getElementById('calwrap'); if (w) w.innerHTML = calHtml(); };
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v, u = now(), c = view.cur;
  if (a === 'signin') return connect(known() ? '' : 'consent');
  if (a === 'backup') return backup();
  if (a === 'tab') { view.tab = v; localStorage.setItem('dash-tab', v); return render(true); }
  if (a === 'mode') { view.mode = v; return reCal(); }
  if (a === 'pick') { view.cur = new Date(v + 'T00:00'); return reCal(); }
  if (a === 'today') { view.cur = new Date(); return reCal(); }
  if (a === 'nav') { const k = +v; view.cur = view.mode === 'month' ? new Date(c.getFullYear(), c.getMonth() + k, 1) : new Date(c.getFullYear(), c.getMonth(), c.getDate() + k * (view.mode === 'week' ? 7 : 1)); return reCal(); }
  if (a === 'goday') { view.cur = new Date(v + 'T00:00'); view.mode = 'day'; return reCal(); }
  if (a === 'tog') lineOp('todo', +v, l => { const x = pTodo(l.trim()); if (!x) return l; const c = x.c ? lineD(x.c) + ' ' : ''; return x.k ? c + x.t : '### ' + c + '> ' + lineD(u) + ' ' + x.t; });
  if (a === 'deltask') lineOp('todo', +v, () => null);
  if (a === 'hab') lineOp('habit', +v, l => { const x = pHabit(l.trim()); if (!x) return l; const s = b.dataset.d; if (x.days[s]) delete x.days[s]; else x.days[s] = 1; return x.name + ' | ' + Object.keys(x.days).sort().join(', '); });
  if (a === 'delhab') lineOp('habit', +v, () => null);
  changed();
});
function mkLine(k, d) {
  const t = (d.get('t') || '').trim(); let p;
  if (k === 'rec') {
    const ds = d.getAll('d').map(Number).sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
    if (!ds.length) { toast('Pick at least one day'); return; }
    p = ds.length === 7 ? 'Daily' : ds.map(i => cap(DAYN[i])).join(',');
  } else {
    const mi = MON.indexOf((d.get('mo') || '').trim().slice(0, 3).toLowerCase()), da = +d.get('da');
    if (mi < 0 || !dateOk(2024, mi, da)) { toast('Month needs 3 letters (like Mar) and a valid day'); return; }
    let y = +d.get('yr') || 0;
    if (k === 'once') { const n = new Date(), yy = n.getFullYear(); y = new Date(yy, mi, da) < new Date(yy, n.getMonth(), n.getDate()) ? yy + 1 : yy; }
    p = cap(MON[mi]) + ' ' + da + (y ? ' ' + y : '');
  }
  const s = d.get('s'), e = d.get('e');
  return p + ' ' + (k === 'bday' || !s ? '' : s + (e ? '-' + e : '') + ' ') + t;
}
$app.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, k = f.dataset.f, d = new FormData(f), u = now();
  if (k === 'task') { addLine('todo', lineD(u) + ' ' + d.get('task').trim()); view.rf = 'task'; }
  else if (k === 'habit') addLine('habit', d.get('habit').trim().replace(/\|/g, '') + ' |');
  else { const line = mkLine(k, d); if (!line) return; const cur = state.sched[k].t; state.sched[k] = {t: (cur && !/\n$/.test(cur) ? cur + '\n' : cur) + line, u}; }
  changed();
});
$app.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  state.sched[k] = {t: e.target.value, u: now()}; changed(true); reCal(); const vs = document.getElementById('vis'); if (vs) vs.innerHTML = view.tab === 'todo' ? todoVis() : habitVis();
  const x = document.getElementById('err-' + k); if (x) x.innerHTML = errHtml(k);
});
$app.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('done-box')) view.dopen = e.target.open; }, true);
function backup() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'}));
  a.download = 'dashboard-backup-' + todayStr() + '.json'; a.click(); toast('Backup downloaded');
}
window.addEventListener('online', () => signedIn && pull());
state = norm(load() || {});
render();
window.addEventListener('load', initAuth);
</script>
</body>
</html>
